[package]
name = "zed-theme"
description = "Convert VSCode themes to Zed format"
version = "0.1.0"
edition = "2024"
authors = ["C J Silverio <ceejceej@gmail.com>"]
license = "Parity-7.0.0"
readme = "README.md"
repository = "https://github.com/ceejbot/zed-theme"
homepage = "https://github.com/ceejbot/zed-theme"

[lib]
name = "thematic"
path = "src/lib.rs"

[[bin]]
name = "zed-theme"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.8.1"
clap = { version = "4.4.0", features = ["derive"] }
log = "0.4.27"
lovely_env_logger = "0.6.2"
thiserror = "2.0.12"
